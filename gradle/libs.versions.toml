[versions]
agp = "9.3.0-alpha06"
core = "1.7.0"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
kotlinxCoroutinesTest = "1.11.0"
material = "1.14.0"
